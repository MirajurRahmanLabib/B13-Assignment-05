<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Daisy UI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   
    
    <!-- fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">


    <!-- icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        *{
            font-family: "Outfit", sans-serif;
            font-optical-sizing: auto;
        }
    </style>

    <title>Dashboard</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
</head>
<body class="bg-base-300">
    <header>
        <div class="navbar bg-base-100 shadow-sm lg:px-10">
            <div class="navbar-start flex items-center gap-2 text-xl">
                <img class="w-9" src="./assets/github-logo.png" alt="">
                <span class="font-bold text-2xl">GitHub Issues Tracker</span>
            </div>
            <div class="navbar-end  lg:flex  gap-2">
                <label class="input">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g
                        stroke-linejoin="round"
                        stroke-linecap="round"
                        stroke-width="2.5"
                        fill="none"
                        stroke="currentColor"
                        >
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>
                    <input id="input-search" type="search" required placeholder="Search issues..." />
                </label>
                <button id="btn-search" class="btn btn-primary ">+ New Issue</button>
            </div>
        </div>        
    </header>
    <main class="container mx-auto py-16">
        <nav class="navbar bg-base-100 shadow-sm gap-2 mb-5 px-4">
            <button onclick="loadIssueCards()" id="all" class="btn btn-outline btn-primary">All</button>
            <button onclick="loadIssueCardsOpen()" id="open" class="btn btn-outline btn-primary">Open</button>
            <button onclick="loadIssueCardsClosed()" id="closed" class="btn btn-outline btn-primary">Closed</button>
        </nav>
        <div class="navbar bg-base-100 shadow-sm gap-2 justify-between px-4">
            <div class="flex gap-2">
                <div>
                    <img class="p-2 bg-[#ECE4FF] rounded-full" src="./assets/Aperture.png" alt="">
                </div>
                <div>
                    <h2 class="font-semibold text-xl"><span id="total-issues"></span> Issues</h2>
                    <p class="text-[#64748B]">Track and manage your project issues</p>
                </div>
            </div>
            <div>
                <p class="text-[#00A96E]">&bull; Open</p>
                <p class="text-[#A855F7]">&bull; Closed</p>
            </div>
        </div>
        <!-- issue-container -->
         <!-- Loading-bar -->
        <div id="loading-bar" class="text-center hidden">
            <span class="loading loading-bars loading-xl text-primary "></span>
        </div>
        <div id="issue-container" class=" p-6 grid grid-cols-2 lg:grid-cols-4 gap-3 bg-base-200 shadow-sm ">
            
        </div>
        <!-- Open the modal using ID.showModal() method -->
        <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
        <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
        <div id="details-container" class="modal-box">
            
            <form method="dialog">
                <!-- if there is a button in form, it will close the modal -->
                <button class="btn btn-primary">Close</button>
            </form>
            </div>
        </div>
        </dialog>

    </main>
    <script src="./JS/dashboard.js"></script>
</body>
</html>
